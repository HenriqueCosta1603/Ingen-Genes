plugins {
    id 'dev.architectury.loom' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'dev.architectury.loom'

    group = mod_group
    version = "${mod_version}+${minecraft_version}"
    base.archivesName = "${mod_id}-${project.name}"

    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // Cada plataforma (tudo que nao for :common) inclui o sourceSet do
    // :common direto no seu jar - mecanismo NATIVO do Architectury Loom.
    // Substitui o antigo esquema shadowJar+transformProductionX.
    if (project.path != ':common') {
        dependencies {
            implementation project(':common')
        }
        loom {
            mods {
                main {
                    sourceSet sourceSets.main
                    sourceSet project(':common').sourceSets.main
                }
            }
        }
    }
}
