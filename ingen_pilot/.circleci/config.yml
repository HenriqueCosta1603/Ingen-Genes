version: 2.1

# Compila o InGen Genes (NeoForge + Fabric, MC 1.21.1) na nuvem.
# Cada loader e um step separado pra o log mostrar qual deles falhou;
# o step do Fabric roda mesmo se o do NeoForge falhar (when: always).

jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: large
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx5g"
    steps:
      - checkout
      - run:
          name: Permissao do gradlew
          command: chmod +x ./gradlew
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "gradle.properties" }}-{{ checksum "build.gradle" }}
            - gradle-v1-
      - run:
          name: Build NeoForge
          command: ./gradlew :neoforge:build --no-daemon --stacktrace
      - run:
          name: Build Fabric
          command: ./gradlew :fabric:build --no-daemon --stacktrace
          when: always
      - save_cache:
          key: gradle-v1-{{ checksum "gradle.properties" }}-{{ checksum "build.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
            - .gradle/loom-cache
      - store_artifacts:
          path: neoforge/build/libs
          destination: neoforge
      - store_artifacts:
          path: fabric/build/libs
          destination: fabric

workflows:
  build-mod:
    jobs:
      - build
